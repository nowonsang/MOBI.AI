plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'ai.mobi.posecamera'
version = '0.1.0'

android {
  namespace "ai.mobi.posecamera"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

// Android 표준 카메라(CameraX)와 기기 안에서만 도는 자세 인식(ML Kit Pose Detection, 모델이 APK 에 들어 있어 내려받지 않는다).
// Pleos SDK 가 아니므로 pleos-connect 모듈과 나눴다. 출처·라이선스는 README '오픈소스' 표에 적는다.
// 버전을 올릴 때는 https://dl.google.com/dl/android/maven2/ 의 maven-metadata.xml 과 각 릴리스 노트를 확인한다.
dependencies {
  implementation 'androidx.camera:camera-camera2:1.6.2'
  implementation 'androidx.camera:camera-lifecycle:1.6.2'
  implementation 'androidx.camera:camera-view:1.6.2'
  // 한 장만 분석하므로 속도보다 정확도가 중요해 accurate 모델을 쓴다.
  implementation 'com.google.mlkit:pose-detection-accurate:18.0.0-beta5'
}
